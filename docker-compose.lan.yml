# GPU-server LAN development/test override.
#
# Usage:
#   cp .env.lan.example .env.lan
#   # Set LAN_BIND_IP to the GPU server's internal IPv4 address.
#   ./scripts/deploy-lan.sh
#
# This stack intentionally does NOT attach to Traefik and does not require DNS.
# Browser access:
#   http://<LAN_BIND_IP>:<FRONTEND_EXTERNAL_PORT>
#
# Exposure policy:
# - frontend: GPU server LAN IP only
# - backend: server loopback only
# - PostgreSQL fixture/catalog: server loopback only
# - Oracle test DB: Docker network only (no host-published port)

services:
  medical-db:
    ports: !override
      - "127.0.0.1:${MEDICAL_DB_EXTERNAL_PORT:-5433}:5432"

  catalog-db:
    ports: !override
      - "127.0.0.1:${CATALOG_DB_EXTERNAL_PORT:-5434}:5432"

  backend:
    ports: !override
      - "127.0.0.1:${BACKEND_EXTERNAL_PORT:-8000}:8000"

  frontend:
    ports: !override
      - "${LAN_BIND_IP}:${FRONTEND_EXTERNAL_PORT:-8501}:8501"

  oracle-test:
    ports: !reset []
