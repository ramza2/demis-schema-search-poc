# GPU-server LAN development/test override.
#
# Usage:
#   cp .env.lan.example .env.lan
#   # Set LAN_BIND_IP to the GPU server's internal IPv4 address.
#   bash scripts/deploy-lan.sh
#
# This stack does not publish DEMIS services through Traefik and does not require DNS.
# The backend additionally joins a shared external inference network only to call
# the existing BGE-M3 OpenAI-compatible embedding service.
# Browser access:
#   http://<LAN_BIND_IP>:<FRONTEND_EXTERNAL_PORT>
#
# Exposure policy:
# - frontend: GPU server LAN IP only
# - backend: server loopback only
# - medical/catalog PostgreSQL: Docker network only
# - Oracle test DB: Docker network only
# - embedding service: reached container-to-container over external Docker network;
#   no DEMIS Traefik labels/routes are added

services:
  medical-db:
    ports: !reset []

  catalog-db:
    ports: !reset []

  backend:
    ports: !override
      - "127.0.0.1:${BACKEND_EXTERNAL_PORT:-8000}:8000"
    environment:
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-http://vllm-bge-m3:8000}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      ALLOW_FAKE_SEMANTIC_SEARCH: ${ALLOW_FAKE_SEMANTIC_SEARCH:-false}
    networks: !override
      - demis-net
      - embedding-shared

  frontend:
    ports: !override
      - "${LAN_BIND_IP}:${FRONTEND_EXTERNAL_PORT:-8501}:8501"

  oracle-test:
    ports: !reset []

networks:
  embedding-shared:
    name: ${EMBEDDING_DOCKER_NETWORK:-traefik_proxy}
    external: true
