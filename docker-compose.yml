services:
  medical-db:
    build:
      context: ./database/medical_demo
    container_name: demis-medical-db
    environment:
      POSTGRES_DB: ${MEDICAL_DB_NAME:-medical_demo}
      POSTGRES_USER: ${MEDICAL_DB_USER:-medical_user}
      POSTGRES_PASSWORD: ${MEDICAL_DB_PASSWORD:-medical_pass_change_me}
      SEED_PATIENT_COUNT: ${SEED_PATIENT_COUNT:-200}
      SEED_RANDOM_SEED: ${SEED_RANDOM_SEED:-42}
    ports:
      # Host access / debugging only
      - "${MEDICAL_DB_EXTERNAL_PORT:-5433}:5432"
    volumes:
      - medical_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 120s
    networks:
      - demis-net

  catalog-db:
    image: pgvector/pgvector:pg16
    container_name: demis-catalog-db
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME:-schema_catalog}
      POSTGRES_USER: ${CATALOG_DB_USER:-catalog_user}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_pass_change_me}
    ports:
      # Host access / debugging only
      - "${CATALOG_DB_EXTERNAL_PORT:-5434}:5432"
    volumes:
      - catalog_db_data:/var/lib/postgresql/data
      - ./database/schema_catalog/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - demis-net

  backend:
    build:
      context: ./backend
    container_name: demis-backend
    environment:
      # Compose service DNS (internal network)
      MEDICAL_DB_HOST: medical-db
      MEDICAL_DB_PORT: 5432
      MEDICAL_DB_NAME: ${MEDICAL_DB_NAME:-medical_demo}
      MEDICAL_DB_USER: ${MEDICAL_DB_USER:-medical_user}
      MEDICAL_DB_PASSWORD: ${MEDICAL_DB_PASSWORD:-medical_pass_change_me}
      CATALOG_DB_HOST: catalog-db
      CATALOG_DB_PORT: 5432
      CATALOG_DB_NAME: ${CATALOG_DB_NAME:-schema_catalog}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog_user}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_pass_change_me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Embedding (Step 3). Default fake for fast/CI; set bge_m3, openai_compatible, or koe5.
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-m3}
      # For koe5 offline: EMBEDDING_MODEL_PATH=/models/local/koe5 and HF_HUB_OFFLINE=true
      EMBEDDING_MODEL_PATH: ${EMBEDDING_MODEL_PATH:-}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-8}
      EMBEDDING_MAX_SEQ_LENGTH: ${EMBEDDING_MAX_SEQ_LENGTH:-1024}
      EMBEDDING_NORMALIZE: ${EMBEDDING_NORMALIZE:-true}
      EMBEDDING_NUM_THREADS: ${EMBEDDING_NUM_THREADS:-}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_API_TIMEOUT_SECONDS: ${EMBEDDING_API_TIMEOUT_SECONDS:-60}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-false}
      HF_HOME: /models/hf-cache
      # Step 5.1 evaluation reproducibility (metadata; optional)
      EVALUATION_GIT_COMMIT: ${EVALUATION_GIT_COMMIT:-}
      EVALUATION_MODEL_REVISION: ${EVALUATION_MODEL_REVISION:-}
      # Step 4 search
      ALLOW_FAKE_SEMANTIC_SEARCH: ${ALLOW_FAKE_SEMANTIC_SEARCH:-false}
      TARGET_DB_CONNECT_TIMEOUT_SECONDS: ${TARGET_DB_CONNECT_TIMEOUT_SECONDS:-5}
      TARGET_CREDENTIAL_ENCRYPTION_KEY: ${TARGET_CREDENTIAL_ENCRYPTION_KEY:-}
      SEARCH_RRF_K: ${SEARCH_RRF_K:-60}
      SEARCH_CANDIDATE_MULTIPLIER: ${SEARCH_CANDIDATE_MULTIPLIER:-3}
      SEARCH_CANDIDATE_MIN: ${SEARCH_CANDIDATE_MIN:-20}
    volumes:
      - embedding_model_cache:/models/hf-cache
      - ./models:/models/local:ro
      # Live-mount app/tests for PoC iteration (image still has baked deps).
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./backend/scripts:/app/scripts
      - ./backend/evaluation:/app/evaluation
    ports:
      # Host access / debugging only
      - "${BACKEND_EXTERNAL_PORT:-8000}:8000"
    depends_on:
      medical-db:
        condition: service_healthy
      catalog-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - demis-net

  frontend:
    build:
      context: ./frontend
    container_name: demis-frontend
    volumes:
      - ./frontend/app.py:/app/app.py:ro
      - ./frontend/helpers.py:/app/helpers.py:ro
      # Read Evaluation Results written by backend (./backend/evaluation:/app/evaluation)
      - ./backend/evaluation/results:/app/evaluation/results:ro
    environment:
      # Compose service DNS (internal network)
      BACKEND_URL: http://backend:8000
    ports:
      # Host access / debugging only
      - "${FRONTEND_EXTERNAL_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - demis-net

  # Optional Multi-DB integration fixtures (not started by default).
  # Usage: docker compose --profile integration-dbs up -d mysql-test mariadb-test
  mysql-test:
    profiles: ["integration-dbs"]
    image: mysql:8.4
    container_name: demis-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: iso_demo
      MYSQL_USER: ${MYSQL_TEST_USER:-test}
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:-test}
    ports:
      - "${MYSQL_TEST_EXTERNAL_PORT:-3307}:3306"
    volumes:
      - ./database/integration/mysql_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_TEST_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - demis-net

  oracle-test:
    profiles: ["oracle-test"]
    image: ${ORACLE_TEST_IMAGE:-container-registry.oracle.com/database/free:latest-lite}
    container_name: demis-oracle-test
    environment:
      ORACLE_PWD: ${ORACLE_TEST_SYS_PASSWORD:-OracleDevAdmin123}
      ORACLE_CHARACTERSET: AL32UTF8
      DEMIS_OWNER_PASSWORD: ${DEMIS_ORACLE_OWNER_PASSWORD:-DemisOwnerDev123}
      DEMIS_RO_PASSWORD: ${DEMIS_ORACLE_RO_PASSWORD:-DemisRoDev123}
    ports:
      - "${ORACLE_TEST_EXTERNAL_PORT:-1522}:1521"
    volumes:
      - oracle_test_data:/opt/oracle/oradata
      - ./database/oracle_mock/setup:/opt/oracle/scripts/setup:ro
    shm_size: "1g"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "printf 'WHENEVER SQLERROR EXIT SQL.SQLCODE\\nSELECT COUNT(*) FROM DEMIS_OWNER.TB_PT_MST WHERE 1=0;\\nEXIT;\\n' | sqlplus -s \"DEMIS_RO/${DEMIS_RO_PASSWORD}@//127.0.0.1:1521/FREEPDB1\" >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 60s
    networks:
      - demis-net

  mariadb-test:
    profiles: ["integration-dbs"]
    image: mariadb:11.4
    container_name: demis-mariadb-test
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_TEST_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: iso_demo
      MARIADB_USER: ${MARIADB_TEST_USER:-test}
      MARIADB_PASSWORD: ${MARIADB_TEST_PASSWORD:-test}
    ports:
      - "${MARIADB_TEST_EXTERNAL_PORT:-3308}:3306"
    volumes:
      - ./database/integration/mariadb_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - mariadb_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks:
      - demis-net

volumes:
  medical_db_data:
  catalog_db_data:
  embedding_model_cache:
  mysql_test_data:
  mariadb_test_data:
  oracle_test_data:

networks:
  demis-net:
    driver: bridge
